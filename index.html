<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flipper One Simulator</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #111;
  overflow: hidden;
  font-family: monospace;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.device {
  position: relative;
  width: min(100vw, 1024px);
  aspect-ratio: 1024 / 448;
}

/* THE ACTUAL OVERLAY IMAGE */
#deviceImage {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
}

/* Simulator LCD */
.screen {
  position: absolute;

  /*
    Position of the white LCD in your uploaded image
  */
  left: 33.45%;
  top: 24.8%;
  width: 34.9%;
  height: 44.3%;

  z-index: 2;

  background: #9bbc0f;
  color: #102000;

  padding: 10px;

  overflow: hidden;

  font-family: monospace;

  border-radius: 2px;

  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.15),
    inset 0 0 15px rgba(0,0,0,.15);
}

/* UI buttons */

.control {
  position: absolute;
  z-index: 5;

  border: 0;
  background: transparent;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

/* D-pad */

.up {
  left: 72.5%;
  top: 29%;
  width: 10%;
  height: 11%;
}

.down {
  left: 72.5%;
  top: 47%;
  width: 10%;
  height: 11%;
}

.left {
  left: 70%;
  top: 37%;
  width: 9%;
  height: 13%;
}

.right {
  left: 79%;
  top: 37%;
  width: 9%;
  height: 13%;
}

.ok {
  left: 76%;
  top: 35%;
  width: 7%;
  height: 13%;
  border-radius: 50%;
}

/* Back orange button */

.back {
  left: 84%;
  top: 59%;
  width: 8%;
  height: 12%;
  border-radius: 50%;
}

/* Bottom buttons */

.bottom-left {
  left: 34%;
  top: 73%;
  width: 7%;
  height: 8%;
}

.bottom-right {
  left: 61%;
  top: 73%;
  width: 7%;
  height: 8%;
}

/* Overlay upload */

#uploadPanel {
  position: fixed;
  left: 15px;
  bottom: 15px;

  z-index: 20;

  padding: 10px 14px;

  color: white;
  background: rgba(0,0,0,.75);

  border-radius: 8px;

  font-family: Arial,sans-serif;
  font-size: 13px;
}

#uploadPanel input {
  max-width: 230px;
}

/* Home screen */

.status {
  display: flex;
  justify-content: space-between;

  border-bottom: 2px solid #315000;

  padding-bottom: 5px;

  font-size: 11px;
}

.title {
  text-align: center;

  font-weight: bold;

  font-size: 16px;

  margin: 8px 0;
}

.menu {
  list-style: none;

  margin: 0;
  padding: 0;
}

.menu li {
  padding: 5px 7px;

  margin: 2px 0;

  font-size: 13px;
}

.menu li.selected {
  background: #102000;
  color: #9bbc0f;
}

.info {
  font-size: 10px;
  margin-top: 8px;
  line-height: 1.4;
}

@media(max-width:600px) {

  .screen {
    padding: 5px;
  }

  .status {
    font-size: 7px;
  }

  .title {
    font-size: 10px;
    margin: 3px;
  }

  .menu li {
    font-size: 8px;
    padding: 3px;
  }

  .info {
    font-size: 6px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="device">

    <!-- DEVICE OVERLAY -->
    <img
      id="deviceImage"
      alt="Flipper One shell"
      src="flipperone-shell-overlay-1024.jpg"
    >

    <!-- SIMULATED SCREEN -->
    <div id="screen" class="screen"></div>

    <!-- PHYSICAL BUTTON HIT AREAS -->

    <button class="control up"
      onclick="move(-1)"></button>

    <button class="control down"
      onclick="move(1)"></button>

    <button class="control left"
      onclick="back()"></button>

    <button class="control right"
      onclick="select()"></button>

    <button class="control ok"
      onclick="select()"></button>

    <button class="control back"
      onclick="back()"></button>

    <button class="control bottom-left"
      onclick="back()"></button>

    <button class="control bottom-right"
      onclick="toggleMenu()"></button>

  </div>
</div>


<!--
  If the JPG isn't beside this HTML file,
  choose the uploaded image here.
-->
<div id="uploadPanel">
  Overlay image:
  <input
    type="file"
    id="imageLoader"
    accept="image/*"
  >
</div>


<script>

const apps = [
  ["◈", "Sub-GHz"],
  ["▣", "NFC"],
  ["●", "Infrared"],
  ["◇", "GPIO"],
  ["◆", "Games"],
  ["⚙", "Settings"]
];

let selected = 0;
let page = "home";

const screen = document.getElementById("screen");
const image = document.getElementById("deviceImage");
const loader = document.getElementById("imageLoader");


/* Load overlay from file picker */

loader.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  const url = URL.createObjectURL(file);

  image.src = url;

});


/* Screen */

function renderHome() {

  page = "home";

  screen.innerHTML = `

    <div class="status">
      <span>FLIPPER ONE</span>
      <span>BAT 87%</span>
    </div>

    <div class="title">
      Applications
    </div>

    <ul class="menu">

      ${apps.map((app, i) => `

        <li class="${i === selected ? "selected" : ""}">
          ${app[0]} ${app[1]}
        </li>

      `).join("")}

    </ul>

    <div class="info">
      ▲ ▼ Navigate<br>
      ▶ Select
    </div>

  `;
}


function move(direction) {

  if (page !== "home") return;

  selected += direction;

  if (selected < 0)
    selected = apps.length - 1;

  if (selected >= apps.length)
    selected = 0;

  renderHome();
}


function select() {

  if (page !== "home") return;

  const name = apps[selected][1];

  page = name;

  screen.innerHTML = `

    <div class="status">
      <span>${name}</span>
      <span>BAT 87%</span>
    </div>

    <div class="title">
      ${name}
    </div>

    <ul class="menu">

      <li class="selected">
        ▶ Start
      </li>

      <li>
        Saved Data
      </li>

      <li>
        Settings
      </li>

    </ul>

    <div class="info">
      Simulator mode.<br>
      Hardware functions are virtual.
    </div>

  `;
}


function back() {

  if (page !== "home") {
    renderHome();
  }

}


function toggleMenu() {
  renderHome();
}


/* Keyboard */

document.addEventListener("keydown", function(e) {

  if (e.key === "ArrowUp")
    move(-1);

  if (e.key === "ArrowDown")
    move(1);

  if (e.key === "ArrowRight" ||
      e.key === "Enter")
    select();

  if (e.key === "ArrowLeft" ||
      e.key === "Escape" ||
      e.key === "Backspace")
    back();

});


renderHome();

</script>

</body>
</html>
