<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipper One Simulator</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #111;

    font-family: monospace;
}


/* =========================================================
   DEVICE
   ========================================================= */

#app {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;
}

.device {
    position: relative;

    width: min(100vw, 1024px);

    aspect-ratio: 1024 / 448;

    background-image:
        url("./flipperone-shell-overlay.png");

    background-size: 100% 100%;

    background-position: center;

    background-repeat: no-repeat;
}


/* =========================================================
   ORANGE LCD
   ========================================================= */

.screen {
    position: absolute;

    /*
       LCD POSITION

       Moved UP
       Moved LEFT
       Slightly narrower
    */

    left: 33.4%;
    top: 24.2%;

    width: 33.3%;
    height: 42.0%;

    z-index: 20;

    background: #f28c28 !important;

    color: #321400;

    padding: 9px;

    overflow: hidden;

    border: none;

    border-radius: 2px;

    font-family: monospace;

    opacity: 1;

    box-shadow:
        inset 0 0 0 2px rgba(50, 15, 0, 0.28),
        inset 0 0 15px rgba(90, 30, 0, 0.20);

    mix-blend-mode: normal;
}


/* =========================================================
   STATUS BAR
   ========================================================= */

.status {
    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom:
        2px solid #713000;

    padding-bottom: 5px;

    font-size: 11px;

    font-weight: bold;
}


/* =========================================================
   TITLE
   ========================================================= */

.title {
    text-align: center;

    font-size: 15px;

    font-weight: bold;

    margin: 7px 0;
}


/* =========================================================
   APP MENU
   ========================================================= */

.menu {
    list-style: none;

    padding: 0;

    margin: 0;
}

.menu li {
    padding: 3px 6px;

    margin: 1px 0;

    font-size: 12px;

    border-radius: 1px;

    white-space: nowrap;
}


/* Selected application */

.menu li.selected {

    background: #321400;

    color: #f28c28;
}


/* =========================================================
   INFO
   ========================================================= */

.info {

    margin-top: 6px;

    font-size: 9px;

    line-height: 1.35;
}


/* =========================================================
   INVISIBLE BUTTONS
   ========================================================= */

.control {

    position: absolute;

    z-index: 50;

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   UP
   ========================================================= */

.up {

    left: 72.5%;

    top: 29%;

    width: 10%;

    height: 11%;
}


/* =========================================================
   DOWN
   ========================================================= */

.down {

    left: 72.5%;

    top: 47%;

    width: 10%;

    height: 11%;
}


/* =========================================================
   LEFT
   ========================================================= */

.left {

    left: 70%;

    top: 37%;

    width: 9%;

    height: 13%;
}


/* =========================================================
   RIGHT
   ========================================================= */

.right {

    left: 79%;

    top: 37%;

    width: 9%;

    height: 13%;
}


/* =========================================================
   OK
   ========================================================= */

.ok {

    left: 76%;

    top: 35%;

    width: 7%;

    height: 13%;

    border-radius: 50%;
}


/* =========================================================
   BACK
   ========================================================= */

.back {

    left: 84%;

    top: 59%;

    width: 8%;

    height: 12%;

    border-radius: 50%;
}


/* =========================================================
   BOTTOM LEFT
   ========================================================= */

.bottom-left {

    left: 34%;

    top: 73%;

    width: 7%;

    height: 8%;
}


/* =========================================================
   BOTTOM RIGHT
   ========================================================= */

.bottom-right {

    left: 61%;

    top: 73%;

    width: 7%;

    height: 8%;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .screen {

        padding: 5px;
    }

    .status {

        font-size: 7px;
    }

    .title {

        font-size: 10px;

        margin: 3px 0;
    }

    .menu li {

        font-size: 7px;

        padding: 2px 4px;
    }

    .info {

        font-size: 6px;
    }
}

</style>
</head>


<body>


<div id="app">

    <div class="device">


        <!-- =================================================
             ORANGE SIMULATED SCREEN
             ================================================= -->

        <div
            id="screen"
            class="screen">
        </div>


        <!-- =================================================
             INVISIBLE PHYSICAL BUTTONS
             ================================================= -->


        <button
            class="control up"
            onclick="move(-1)"
            aria-label="Up">
        </button>


        <button
            class="control down"
            onclick="move(1)"
            aria-label="Down">
        </button>


        <button
            class="control left"
            onclick="back()"
            aria-label="Back">
        </button>


        <button
            class="control right"
            onclick="select()"
            aria-label="Select">
        </button>


        <button
            class="control ok"
            onclick="select()"
            aria-label="OK">
        </button>


        <button
            class="control back"
            onclick="back()"
            aria-label="Back">
        </button>


        <button
            class="control bottom-left"
            onclick="back()"
            aria-label="Back">
        </button>


        <button
            class="control bottom-right"
            onclick="home()"
            aria-label="Home">
        </button>


    </div>

</div>



<script>

/* =========================================================
   FLIPPER ONE APPLICATIONS
   ========================================================= */

const apps = [

    {
        icon: "📡",
        name: "Radio / SDR"
    },

    {
        icon: "🌐",
        name: "Network"
    },

    {
        icon: "📶",
        name: "Wi-Fi"
    },

    {
        icon: "📱",
        name: "Cellular"
    },

    {
        icon: "🛰️",
        name: "Satellite"
    },

    {
        icon: "🤖",
        name: "AI"
    },

    {
        icon: "💻",
        name: "Terminal"
    },

    {
        icon: "🔧",
        name: "Tools"
    },

    {
        icon: "📂",
        name: "Files"
    },

    {
        icon: "⚙️",
        name: "Settings"
    },

    {
        icon: "🧩",
        name: "Apps"
    },

    {
        icon: "🔌",
        name: "Modules"
    }

];


/* =========================================================
   STATE
   ========================================================= */

let selected = 0;

let page = "home";

const screen =
    document.getElementById("screen");


/* =========================================================
   HOME SCREEN
   ========================================================= */

function renderHome() {

    page = "home";


    screen.innerHTML = `

        <div class="status">

            <span>
                FLIPPER ONE
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">
            Applications
        </div>


        <ul class="menu">

            ${
                apps.map((app, index) => `

                    <li
                        class="${
                            index === selected
                                ? "selected"
                                : ""
                        }"
                    >

                        ${app.icon}
                        ${app.name}

                    </li>

                `).join("")
            }

        </ul>


        <div class="info">

            ▲ ▼ Navigate<br>

            ▶ Select

        </div>

    `;
}


/* =========================================================
   MOVE UP / DOWN
   ========================================================= */

function move(direction) {

    if (page !== "home") {

        return;
    }


    selected += direction;


    if (selected < 0) {

        selected =
            apps.length - 1;
    }


    if (selected >= apps.length) {

        selected = 0;
    }


    renderHome();
}


/* =========================================================
   SELECT APP
   ========================================================= */

function select() {

    if (page !== "home") {

        return;
    }


    const app =
        apps[selected];


    page =
        app.name;


    screen.innerHTML = `

        <div class="status">

            <span>
                ${app.name}
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">

            ${app.icon}
            ${app.name}

        </div>


        <ul class="menu">

            <li class="selected">

                ▶ Start

            </li>


            <li>

                Options

            </li>


            <li>

                Saved Data

            </li>


            <li>

                About

            </li>

        </ul>


        <div class="info">

            FLIPPER ONE<br>

            Virtual environment.

        </div>

    `;
}


/* =========================================================
   BACK
   ========================================================= */

function back() {

    if (page !== "home") {

        renderHome();

    }

}


/* =========================================================
   HOME
   ========================================================= */

function home() {

    selected = 0;

    renderHome();

}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        /* UP */

        if (event.key === "ArrowUp") {

            event.preventDefault();

            move(-1);
        }


        /* DOWN */

        if (event.key === "ArrowDown") {

            event.preventDefault();

            move(1);
        }


        /* SELECT */

        if (
            event.key === "ArrowRight" ||
            event.key === "Enter"
        ) {

            event.preventDefault();

            select();
        }


        /* BACK */

        if (
            event.key === "ArrowLeft" ||
            event.key === "Escape" ||
            event.key === "Backspace"
        ) {

            event.preventDefault();

            back();
        }


        /* HOME */

        if (event.key === "Home") {

            event.preventDefault();

            home();
        }

    }
);


/* =========================================================
   START
   ========================================================= */

renderHome();

</script>

</body>
</html>
