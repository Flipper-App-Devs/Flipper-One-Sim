<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flipper One Simulator</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #111;
  overflow: hidden;
  font-family: monospace;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.device {
  position: relative;

  width: min(100vw, 1024px);
  aspect-ratio: 1024 / 448;
}

/* YOUR GITHUB OVERLAY IMAGE */
.device-image {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  z-index: 1;
}

/*
   SCREEN IN THE ACTUAL DEVICE

   Your PNG is 1024 x 448.

   LCD opening:
   x ≈ 335
   y ≈ 108
   width ≈ 354
   height ≈ 202
*/

.screen {
  position: absolute;

  left: 32.7%;
  top: 24.1%;

  width: 35.1%;
  height: 45.0%;

  z-index: 2;

  background: #9bbc0f;
  color: #102000;

  padding: 10px;

  overflow: hidden;

  font-family: monospace;

  border-radius: 2px;

  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.25),
    inset 0 0 15px rgba(0,0,0,.15);
}

/* SCREEN */

.status {
  display: flex;
  justify-content: space-between;

  border-bottom: 2px solid #315000;

  padding-bottom: 5px;

  font-size: 11px;
}

.title {
  text-align: center;

  font-weight: bold;

  font-size: 16px;

  margin: 8px 0;
}

.menu {
  list-style: none;

  margin: 0;
  padding: 0;
}

.menu li {
  padding: 5px 7px;

  margin: 2px 0;

  font-size: 13px;
}

.menu li.selected {
  background: #102000;
  color: #9bbc0f;
}

.info {
  margin-top: 8px;

  font-size: 10px;

  line-height: 1.4;
}

/* INVISIBLE BUTTON HIT AREAS */

.control {
  position: absolute;

  z-index: 5;

  border: 0;

  background: transparent;

  cursor: pointer;

  padding: 0;
}

/* D-PAD */

.up {
  left: 72.5%;
  top: 29%;
  width: 10%;
  height: 11%;
}

.down {
  left: 72.5%;
  top: 47%;
  width: 10%;
  height: 11%;
}

.left {
  left: 70%;
  top: 37%;
  width: 9%;
  height: 13%;
}

.right {
  left: 79%;
  top: 37%;
  width: 9%;
  height: 13%;
}

.ok {
  left: 76%;
  top: 35%;
  width: 7%;
  height: 13%;

  border-radius: 50%;
}

/* ORANGE BACK BUTTON */

.back {
  left: 84%;
  top: 59%;
  width: 8%;
  height: 12%;

  border-radius: 50%;
}

/* BOTTOM PHYSICAL BUTTONS */

.bottom-left {
  left: 34%;
  top: 73%;
  width: 7%;
  height: 8%;
}

.bottom-right {
  left: 61%;
  top: 73%;
  width: 7%;
  height: 8%;
}

/* MOBILE */

@media (max-width: 600px) {

  .screen {
    padding: 5px;
  }

  .status {
    font-size: 7px;
  }

  .title {
    font-size: 10px;
    margin: 3px;
  }

  .menu li {
    font-size: 8px;
    padding: 3px;
  }

  .info {
    font-size: 6px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="device">

    <!--
      THIS IS THE IMAGE ALREADY IN YOUR GITHUB REPO.
      Do NOT change this filename.
    -->
    <img
      class="device-image"
      src="./flipperone-shell-overlay.png"
      alt="Flipper One"
    >

    <!-- SIMULATED LCD -->
    <div id="screen" class="screen"></div>

    <!-- PHYSICAL BUTTON HIT AREAS -->

    <button
      class="control up"
      onclick="move(-1)">
    </button>

    <button
      class="control down"
      onclick="move(1)">
    </button>

    <button
      class="control left"
      onclick="back()">
    </button>

    <button
      class="control right"
      onclick="select()">
    </button>

    <button
      class="control ok"
      onclick="select()">
    </button>

    <button
      class="control back"
      onclick="back()">
    </button>

    <button
      class="control bottom-left"
      onclick="back()">
    </button>

    <button
      class="control bottom-right"
      onclick="home()">
    </button>

  </div>

</div>

<script>

const apps = [
  {
    icon: "◈",
    name: "Sub-GHz"
  },
  {
    icon: "▣",
    name: "NFC"
  },
  {
    icon: "●",
    name: "Infrared"
  },
  {
    icon: "◇",
    name: "GPIO"
  },
  {
    icon: "◆",
    name: "Games"
  },
  {
    icon: "⚙",
    name: "Settings"
  }
];

let selected = 0;
let page = "home";

const screen =
  document.getElementById("screen");


/* HOME */

function renderHome() {

  page = "home";

  screen.innerHTML = `

    <div class="status">
      <span>FLIPPER ONE</span>
      <span>BAT 87%</span>
    </div>

    <div class="title">
      Applications
    </div>

    <ul class="menu">

      ${apps.map((app, i) => `

        <li class="${i === selected ? "selected" : ""}">
          ${app.icon} ${app.name}
        </li>

      `).join("")}

    </ul>

    <div class="info">
      ▲ ▼ Navigate<br>
      ▶ Select
    </div>

  `;
}


/* UP / DOWN */

function move(direction) {

  if (page !== "home")
    return;

  selected += direction;

  if (selected < 0)
    selected = apps.length - 1;

  if (selected >= apps.length)
    selected = 0;

  renderHome();
}


/* SELECT */

function select() {

  if (page !== "home")
    return;

  const app = apps[selected];

  page = app.name;

  screen.innerHTML = `

    <div class="status">
      <span>${app.name}</span>
      <span>BAT 87%</span>
    </div>

    <div class="title">
      ${app.icon} ${app.name}
    </div>

    <ul class="menu">

      <li class="selected">
        ▶ Start
      </li>

      <li>
        Saved Data
      </li>

      <li>
        Settings
      </li>

    </ul>

    <div class="info">
      Simulator mode.<br>
      Hardware functions are virtual.
    </div>

  `;
}


/* BACK */

function back() {

  if (page !== "home") {
    renderHome();
  }

}


/* HOME */

function home() {
  renderHome();
}


/* KEYBOARD */

document.addEventListener("keydown", function(e) {

  switch (e.key) {

    case "ArrowUp":
      move(-1);
      break;

    case "ArrowDown":
      move(1);
      break;

    case "ArrowRight":
    case "Enter":
      select();
      break;

    case "ArrowLeft":
    case "Escape":
    case "Backspace":
      back();
      break;

    case "Home":
      home();
      break;

  }

});


/* START */

renderHome();

</script>

</body>
</html>
