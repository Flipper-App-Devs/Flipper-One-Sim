<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipper One Simulator</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: monospace;
}


/* =========================================================
   DEVICE
   ========================================================= */

#app {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.device {
    position: relative;

    width: min(100vw, 1024px);

    aspect-ratio: 1024 / 448;

    background-image:
        url("./flipperone-shell-overlay.png");

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}


/* =========================================================
   ORANGE LCD
   ========================================================= */

.screen {

    position: absolute;

    /*
    ================================================
    LCD POSITION

    Noticeably moved UP and LEFT.

    Previous:
      left: 33.4%
      top: 24.2%

    Now:
      left: 32.1%
      top: 21.5%

    Also slightly smaller.
    ================================================
    */

    left: 32.1%;
    top: 21.5%;

    width: 32.8%;
    height: 40.5%;

    z-index: 20;

    background: #f28c28;

    color: #321400;

    padding: 8px;

    border-radius: 2px;

    overflow: hidden;

    font-family: monospace;

    box-shadow:
        inset 0 0 0 2px rgba(50,15,0,.28),
        inset 0 0 14px rgba(90,30,0,.20);

    isolation: isolate;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    height: 18px;

    display: flex;

    justify-content: space-between;
    align-items: center;

    border-bottom: 2px solid #713000;

    padding-bottom: 4px;

    font-size: 10px;

    font-weight: bold;

    flex-shrink: 0;
}


/* =========================================================
   TITLE
   ========================================================= */

.title {

    text-align: center;

    font-size: 14px;

    font-weight: bold;

    margin: 5px 0;

    height: 18px;

    line-height: 18px;

    flex-shrink: 0;
}


/* =========================================================
   MENU VIEWPORT

   THIS IS THE IMPORTANT SCROLLING PART
   ========================================================= */

.menu-window {

    position: relative;

    height: 105px;

    overflow: hidden;

    width: 100%;
}


/* Actual moving list */

.menu {

    list-style: none;

    padding: 0;
    margin: 0;

    width: 100%;

    transition:
        transform 0.12s ease-out;
}


/* App rows */

.menu li {

    height: 22px;

    line-height: 22px;

    padding: 0 6px;

    margin: 1px 0;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    border-radius: 2px;
}


/* Selected row */

.menu li.selected {

    background: #321400;

    color: #f28c28;
}


/* =========================================================
   SCROLL INDICATOR
   ========================================================= */

.scrollbar {

    position: absolute;

    right: 1px;
    top: 0;

    width: 3px;

    height: 105px;

    background: rgba(50,20,0,.18);

    border-radius: 3px;

    pointer-events: none;
}

.scroll-thumb {

    position: absolute;

    right: 0;

    width: 3px;

    background: #321400;

    border-radius: 3px;

    transition:
        top 0.12s ease-out;
}


/* =========================================================
   INFO
   ========================================================= */

.info {

    position: absolute;

    bottom: 5px;

    left: 8px;

    right: 8px;

    font-size: 8px;

    line-height: 10px;

    border-top: 1px solid rgba(80,30,0,.35);

    padding-top: 3px;

    background: #f28c28;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.control {

    position: absolute;

    z-index: 50;

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   D-PAD
   ========================================================= */

.up {

    left: 72.5%;
    top: 29%;

    width: 10%;
    height: 11%;
}

.down {

    left: 72.5%;
    top: 47%;

    width: 10%;
    height: 11%;
}

.left {

    left: 70%;
    top: 37%;

    width: 9%;
    height: 13%;
}

.right {

    left: 79%;
    top: 37%;

    width: 9%;
    height: 13%;
}


/* =========================================================
   OK
   ========================================================= */

.ok {

    left: 76%;
    top: 35%;

    width: 7%;
    height: 13%;

    border-radius: 50%;
}


/* =========================================================
   BACK
   ========================================================= */

.back {

    left: 84%;
    top: 59%;

    width: 8%;
    height: 12%;

    border-radius: 50%;
}


/* =========================================================
   BOTTOM BUTTONS
   ========================================================= */

.bottom-left {

    left: 34%;
    top: 73%;

    width: 7%;
    height: 8%;
}

.bottom-right {

    left: 61%;
    top: 73%;

    width: 7%;
    height: 8%;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .screen {

        padding: 5px;
    }

    .status {

        font-size: 6px;

        height: 14px;
    }

    .title {

        font-size: 9px;

        height: 14px;
        line-height: 14px;

        margin: 3px 0;
    }

    .menu-window {

        height: 82px;
    }

    .menu li {

        height: 17px;

        line-height: 17px;

        font-size: 7px;
    }

    .scrollbar {

        height: 82px;
    }

    .info {

        font-size: 5px;
        line-height: 7px;
    }
}

</style>
</head>


<body>


<div id="app">

    <div class="device">


        <!-- =================================================
             ORANGE SCREEN
             ================================================= -->

        <div
            id="screen"
            class="screen">
        </div>


        <!-- =================================================
             BUTTONS
             ================================================= -->

        <button
            class="control up"
            onclick="move(-1)"
            aria-label="Up">
        </button>

        <button
            class="control down"
            onclick="move(1)"
            aria-label="Down">
        </button>

        <button
            class="control left"
            onclick="back()"
            aria-label="Back">
        </button>

        <button
            class="control right"
            onclick="select()"
            aria-label="Select">
        </button>

        <button
            class="control ok"
            onclick="select()"
            aria-label="OK">
        </button>

        <button
            class="control back"
            onclick="back()"
            aria-label="Back">
        </button>

        <button
            class="control bottom-left"
            onclick="back()"
            aria-label="Back">
        </button>

        <button
            class="control bottom-right"
            onclick="home()"
            aria-label="Home">
        </button>

    </div>

</div>


<script>


/* =========================================================
   FLIPPER ONE APPS
   ========================================================= */

const apps = [

    {
        icon: "📡",
        name: "Radio / SDR"
    },

    {
        icon: "🌐",
        name: "Network"
    },

    {
        icon: "📶",
        name: "Wi-Fi"
    },

    {
        icon: "📱",
        name: "Cellular"
    },

    {
        icon: "🛰️",
        name: "Satellite"
    },

    {
        icon: "🤖",
        name: "AI"
    },

    {
        icon: "💻",
        name: "Terminal"
    },

    {
        icon: "🔧",
        name: "Tools"
    },

    {
        icon: "📂",
        name: "Files"
    },

    {
        icon: "⚙️",
        name: "Settings"
    },

    {
        icon: "🧩",
        name: "Apps"
    },

    {
        icon: "🔌",
        name: "Modules"
    }

];


/* =========================================================
   STATE
   ========================================================= */

let selected = 0;

let page = "home";


const screen =
    document.getElementById("screen");


/* =========================================================
   RENDER HOME
   ========================================================= */

function renderHome() {

    page = "home";


    screen.innerHTML = `

        <div class="status">

            <span>
                FLIPPER ONE
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">
            Applications
        </div>


        <div
            class="menu-window"
            id="menuWindow"
        >

            <ul
                class="menu"
                id="menu"
            >

                ${
                    apps.map((app, index) => `

                        <li
                            class="${
                                index === selected
                                    ? "selected"
                                    : ""
                            }"
                            data-index="${index}"
                        >

                            ${app.icon}
                            ${app.name}

                        </li>

                    `).join("")
                }

            </ul>


            <div class="scrollbar">

                <div
                    class="scroll-thumb"
                    id="scrollThumb"
                ></div>

            </div>

        </div>


        <div class="info">

            ▲ ▼ Navigate
            &nbsp;&nbsp;
            ▶ Select

        </div>

    `;


    updateScroll();
}


/* =========================================================
   SCROLL MENU
   ========================================================= */

function updateScroll() {

    const menu =
        document.getElementById("menu");

    const windowElement =
        document.getElementById("menuWindow");

    const thumb =
        document.getElementById("scrollThumb");


    if (!menu || !windowElement) {
        return;
    }


    const items =
        menu.querySelectorAll("li");


    if (!items.length) {
        return;
    }


    /*
       Each item is approximately 23px tall.
    */

    const rowHeight = 23;

    const visibleRows =
        Math.floor(
            windowElement.clientHeight /
            rowHeight
        );


    /*
       Maximum number of rows we can scroll.
    */

    const maxScroll =
        Math.max(
            0,
            apps.length - visibleRows
        );


    /*
       Keep selected item visible.
    */

    let scrollIndex = 0;


    if (selected >= visibleRows) {

        scrollIndex =
            selected - visibleRows + 1;

    }


    if (scrollIndex > maxScroll) {

        scrollIndex =
            maxScroll;

    }


    if (scrollIndex < 0) {

        scrollIndex = 0;

    }


    /*
       Move list.
    */

    menu.style.transform =
        `translateY(-${scrollIndex * rowHeight}px)`;


    /*
       Scroll bar.
    */

    if (thumb) {

        if (maxScroll === 0) {

            thumb.style.height = "100%";
            thumb.style.top = "0";

        } else {

            const trackHeight =
                windowElement.clientHeight;

            const thumbHeight =
                Math.max(
                    20,
                    trackHeight *
                    (visibleRows / apps.length)
                );


            const travel =
                trackHeight -
                thumbHeight;


            const percentage =
                scrollIndex / maxScroll;


            thumb.style.height =
                `${thumbHeight}px`;


            thumb.style.top =
                `${travel * percentage}px`;
        }
    }
}


/* =========================================================
   MOVE
   ========================================================= */

function move(direction) {

    if (page !== "home") {
        return;
    }


    selected += direction;


    /*
       Wrap around
    */

    if (selected < 0) {

        selected =
            apps.length - 1;
    }


    if (selected >= apps.length) {

        selected = 0;
    }


    renderHome();
}


/* =========================================================
   SELECT
   ========================================================= */

function select() {

    if (page !== "home") {
        return;
    }


    const app =
        apps[selected];


    page =
        app.name;


    screen.innerHTML = `

        <div class="status">

            <span>
                ${app.icon}
                ${app.name}
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">

            ${app.icon}
            ${app.name}

        </div>


        <div class="menu-window">

            <ul class="menu">

                <li class="selected">
                    ▶ Start
                </li>

                <li>
                    Options
                </li>

                <li>
                    Saved Data
                </li>

                <li>
                    About
                </li>

            </ul>

        </div>


        <div class="info">

            FLIPPER ONE<br>
            Virtual environment.

        </div>

    `;
}


/* =========================================================
   BACK
   ========================================================= */

function back() {

    if (page !== "home") {

        renderHome();

    }

}


/* =========================================================
   HOME
   ========================================================= */

function home() {

    selected = 0;

    renderHome();

}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        switch (event.key) {

            case "ArrowUp":

                event.preventDefault();

                move(-1);

                break;


            case "ArrowDown":

                event.preventDefault();

                move(1);

                break;


            case "ArrowRight":

            case "Enter":

                event.preventDefault();

                select();

                break;


            case "ArrowLeft":

            case "Escape":

            case "Backspace":

                event.preventDefault();

                back();

                break;


            case "Home":

                event.preventDefault();

                home();

                break;

        }

    }
);


/* =========================================================
   START
   ========================================================= */

renderHome();

</script>

</body>
</html>
