<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipper One Simulator</title>
<link rel="icon" type="image/jpeg" href="images.jpg">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: monospace;
}

#app {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   DEVICE
   ========================================================= */

.device {
    position: relative;

    width: min(100vw, 1024px);

    aspect-ratio: 1024 / 448;
}


/* =========================================================
   FIXED OVERLAY IMAGE

   THIS NEVER MOVES
   ========================================================= */

.device-image {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   LCD SCREEN

   ONLY THE LCD MOVES
   ========================================================= */

.screen {
    position: absolute;

    left: calc(50.25% + 1.5mm);
    top: 45.1%;

    width: calc(33.5% - 2mm);
    height: 42.8%;

    transform: translate(-50%, -50%);

    z-index: 10;

    background: #f28c28;

    color: #321400;

    padding: 8px;

    border: none;

    border-radius: 2px;

    overflow: hidden;

    font-family: monospace;

    box-shadow:
        inset 0 0 0 2px rgba(55, 20, 0, 0.25),
        inset 0 0 14px rgba(90, 30, 0, 0.18);
}


/* =========================================================
   TOP BAR
   ========================================================= */

.status {
    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #d96f18;

    color: #241000;

    margin: -8px -8px 0 -8px;

    padding: 5px 8px;

    height: 24px;

    border-bottom: 2px solid #a84d0d;

    font-size: 10px;

    font-weight: bold;

    flex-shrink: 0;
}


/* =========================================================
   TITLE
   ========================================================= */

.title {
    text-align: center;

    font-size: 14px;

    font-weight: bold;

    margin: 5px 0;

    height: 18px;

    line-height: 18px;

    flex-shrink: 0;
}


/* =========================================================
   IDLE SCREEN (dolphin home screen)
   ========================================================= */

.idle-screen {
    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    height: 122px;

    gap: 2px;
}

.idle-clock {
    font-size: 20px;

    font-weight: bold;

    letter-spacing: 1px;
}

.idle-dolphin {
    font-size: 40px;

    line-height: 1;

    margin: 2px 0;

    filter:
        grayscale(1)
        brightness(0.35)
        sepia(1)
        saturate(4)
        hue-rotate(-25deg);

    animation: idle-bob 2.4s ease-in-out infinite;
}

@keyframes idle-bob {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-3px);
    }

}

.idle-waves {
    font-size: 10px;

    letter-spacing: 1px;

    opacity: 0.6;
}

.idle-caption {
    font-size: 9px;

    margin-top: 4px;

    opacity: 0.75;
}


/* =========================================================
   MENU WINDOW
   ========================================================= */

.menu-window {
    position: relative;

    width: 100%;

    height: 122px;

    overflow-y: auto;

    overflow-x: hidden;

    scrollbar-width: none;

    -ms-overflow-style: none;
}

.menu-window::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   MENU
   ========================================================= */

.menu {
    list-style: none;

    padding: 0;
    margin: 0;

    width: 100%;
}

.menu li {
    height: 22px;

    min-height: 22px;

    line-height: 22px;

    padding: 0 6px;

    margin: 1px 0;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    border-radius: 2px;
}

.menu li.selected {
    background: #321400;

    color: #f28c28;
}



/* =========================================================
   INFO
   ========================================================= */

.info {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 5px;

    padding-top: 3px;

    border-top:
        1px solid rgba(80, 30, 0, 0.35);

    background: #f28c28;

    font-size: 8px;

    line-height: 10px;
}

.soft-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 4px;
}

.soft-btn {
    display: inline-block;

    padding: 1px 5px;

    border: 1px solid rgba(50, 20, 0, 0.55);

    border-radius: 3px;

    background: rgba(50, 20, 0, 0.08);

    white-space: nowrap;
}


/* =========================================================
   GENERIC APP CONTENT
   ========================================================= */

.app-content {
    position: relative;

    width: 100%;

    height: 122px;

    overflow-y: auto;

    overflow-x: hidden;

    scrollbar-width: none;
}

.app-content::-webkit-scrollbar {
    display: none;
}

.app-line {
    height: 21px;

    line-height: 21px;

    padding: 0 6px;

    font-size: 10px;

    white-space: nowrap;
}

.app-line.selected {
    background: #321400;

    color: #f28c28;
}


/* =========================================================
   TERMINAL
   ========================================================= */

.terminal {
    height: 122px;

    overflow-y: auto;

    font-size: 9px;

    line-height: 13px;

    white-space: pre-wrap;

    padding: 2px 4px;

    scrollbar-width: none;
}

.terminal::-webkit-scrollbar {
    display: none;
}

.terminal-input {
    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: #321400;

    font-family: monospace;

    font-size: 9px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.control {
    position: absolute;

    z-index: 50;

    border: none;

    background: transparent;

    padding: 0;
    margin: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   D-PAD
   ========================================================= */

.up {
    left: 72.5%;
    top: 29%;

    width: 10%;
    height: 11%;
}

.down {
    left: 72.5%;
    top: 47%;

    width: 10%;
    height: 11%;
}

.left {
    left: 70%;
    top: 37%;

    width: 9%;
    height: 13%;
}

.right {
    left: 79%;
    top: 37%;

    width: 9%;
    height: 13%;
}

.ok {
    left: 76%;
    top: 35%;

    width: 7%;
    height: 13%;

    border-radius: 50%;
}


/* =========================================================
   BACK
   ========================================================= */

.back {
    left: 84%;
    top: 59%;

    width: 8%;
    height: 12%;

    border-radius: 50%;
}


/* =========================================================
   BOTTOM BUTTONS
   ========================================================= */

.bottom-left {
    left: 34%;
    top: 73%;

    width: 7%;
    height: 8%;
}

.bottom-right {
    left: 61%;
    top: 73%;

    width: 7%;
    height: 8%;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .screen {
        padding: 5px;
    }

    .status {
        height: 16px;

        margin: -5px -5px 0 -5px;

        padding: 3px 5px;

        font-size: 6px;
    }

    .title {
        font-size: 9px;

        height: 14px;

        line-height: 14px;

        margin: 3px 0;
    }

    .menu-window,
    .app-content {
        height: 88px;
    }

    .menu li {
        height: 17px;

        min-height: 17px;

        line-height: 17px;

        font-size: 7px;
    }

    .info {
        font-size: 5px;

        line-height: 7px;
    }

    .soft-btn {
        padding: 1px 3px;
    }
}

</style>
</head>


<body>

<div id="app">

<div class="device">

    <!-- FIXED DEVICE IMAGE -->
    <img
        class="device-image"
        src="./flipperone-shell-overlay.png"
        alt="Flipper One"
    >


    <!-- LCD -->
    <div
        id="screen"
        class="screen">
    </div>


    <!-- INVISIBLE BUTTON HIT AREAS -->

    <button
        class="control up"
        onclick="move(-1)">
    </button>

    <button
        class="control down"
        onclick="move(1)">
    </button>

    <button
        class="control left"
        onclick="back()">
    </button>

    <button
        class="control right"
        onclick="select()">
    </button>

    <button
        class="control ok"
        onclick="select()">
    </button>

    <button
        class="control back"
        onclick="back()">
    </button>

    <button
        class="control bottom-left"
        onclick="back()">
    </button>

    <button
        class="control bottom-right"
        onclick="home()">
    </button>

</div>

</div>


<script>

/* =========================================================
   APPS (home screen list)
   ========================================================= */

const apps = [

    { icon: "🖥️", name: "Computer" },
    { icon: "🧩", name: "Apps" },
    { icon: "🌐", name: "Network" },
    { icon: "🧪", name: "Testing" },
    { icon: "⚙️", name: "Settings" },
    { icon: "💾", name: "Boot Profiles" }

];


/* =========================================================
   CORE STATE

   `page`  - "idle"     : the dolphin idle screen (real start
                          screen on a Flipper device)
             "launcher" : the scrollable app list
             <app name> : an open app
   `nav`   - a stack of screens *within* the current app.
             Each screen owns its own row data and knows
             what OK / Back should do, so every app can go
             several levels deep (menu -> list -> detail)
             the way real Flipper apps do, and Back always
             walks back out one level at a time.
   ========================================================= */

let selected = 0;
let page = "idle";
let appSelected = 0;
let nav = [];

let batteryPct = 87;
let idleTimer = null;


/* =========================================================
   DOM
   ========================================================= */

const screen =
    document.getElementById("screen");


/* =========================================================
   NAV STACK HELPERS
   ========================================================= */

function currentScreen() {

    return nav.length
        ? nav[nav.length - 1]
        : null;
}

function pushScreen(screenDef) {

    /*
       screenDef = { render, onSelect, onBack, cleanup }
       onSelect(index) -> called when OK pressed on a row
       onBack()        -> optional override for Back;
                           return true if it handled Back
                           itself (e.g. stopping an action
                           instead of leaving the screen)
    */

    nav.push(screenDef);

    appSelected = 0;

    screenDef.render();
}

function replaceScreen(screenDef) {

    leaveTopScreen();

    nav[nav.length - 1] = screenDef;

    appSelected = 0;

    screenDef.render();
}

function leaveTopScreen() {

    const top = currentScreen();

    if (top && typeof top.cleanup === "function") {

        top.cleanup();

    }
}


/* =========================================================
   IDLE SCREEN (dolphin home screen)
   ========================================================= */

function renderIdle() {

    page = "idle";
    nav = [];

    screen.innerHTML = `

        <div class="status">
            <span>FLIPPER ONE</span>
            <span>BAT ${batteryPct}%</span>
        </div>

        <div class="idle-screen">

            <div class="idle-clock" id="idleClock">${clockString()}</div>

            <div class="idle-dolphin">🐬</div>

            <div class="idle-waves">〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜〜</div>

            <div class="idle-caption">Press ▶ to open menu</div>

        </div>

        <div class="info">
            <div class="soft-buttons">${softButtons("Any button   ▶ Main Menu")}</div>
        </div>
    `;

    clearInterval(idleTimer);

    idleTimer = setInterval(() => {

        const clock = document.getElementById("idleClock");

        if (clock) {
            clock.textContent = clockString();
        }

    }, 1000);

}

function clockString() {

    const now = new Date();
    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");

    return `${h}:${m}`;

}


/* =========================================================
   LAUNCHER (app list)
   ========================================================= */

function openLauncher() {

    clearInterval(idleTimer);

    selected = 0;

    renderLauncher();

}

function renderLauncher() {

    page = "launcher";
    nav = [];

    screen.innerHTML = `

        <div class="status">
            <span>FLIPPER ONE</span>
            <span>BAT ${batteryPct}%</span>
        </div>

        <div class="title">
            Applications
        </div>

        <div class="menu-window" id="menuWindow">

            <ul class="menu" id="menu">

                ${
                    apps.map((app, index) => `
                    <li
                        data-index="${index}"
                        class="${index === selected ? "selected" : ""}"
                    >
                        ${app.icon} ${app.name}
                    </li>
                    `).join("")
                }

            </ul>

        </div>

        <div class="info">
            <div class="soft-buttons">${softButtons("▲ ▼ Navigate   ▶ Open   ◀ Idle")}</div>
        </div>
    `;

    requestAnimationFrame(() => {

        scrollToSelected();

    });
}


/* =========================================================
   SCROLL TO SELECTED (launcher)
   ========================================================= */

function scrollToSelected() {

    const menuWindow = document.getElementById("menuWindow");
    const item = document.querySelector(`.menu li[data-index="${selected}"]`);

    if (!menuWindow || !item) {
        return;
    }

    const itemTop = item.offsetTop;
    const itemBottom = itemTop + item.offsetHeight;
    const visibleTop = menuWindow.scrollTop;
    const visibleBottom = visibleTop + menuWindow.clientHeight;

    if (itemTop < visibleTop) {

        menuWindow.scrollTop = itemTop;

    } else if (itemBottom > visibleBottom) {

        menuWindow.scrollTop = itemBottom - menuWindow.clientHeight;

    }

}


/* =========================================================
   MOVE  (▲ ▼)
   ========================================================= */

function move(direction) {

    if (page === "idle") {

        openLauncher();
        return;

    }

    if (page === "launcher") {

        selected += direction;

        if (selected < 0) selected = apps.length - 1;
        if (selected >= apps.length) selected = 0;

        renderLauncher();
        return;

    }

    moveAppMenu(direction);
}

function moveAppMenu(direction) {

    const items = document.querySelectorAll(".app-line[data-row]");

    if (!items.length) {
        return;
    }

    appSelected += direction;

    if (appSelected < 0) appSelected = items.length - 1;
    if (appSelected >= items.length) appSelected = 0;

    items.forEach((item, index) => {
        item.classList.toggle("selected", index === appSelected);
    });

    items[appSelected].scrollIntoView({ block: "nearest" });
}


/* =========================================================
   SELECT (OK / ▶)
   ========================================================= */

function select() {

    if (page === "idle") {

        openLauncher();
        return;

    }

    if (page === "launcher") {

        openApp(apps[selected].name);
        return;

    }

    const top = currentScreen();

    if (top && typeof top.onSelect === "function") {

        top.onSelect(appSelected);

    }
}


/* =========================================================
   BACK (◀)
   ========================================================= */

function back() {

    if (page === "idle") {
        return;
    }

    if (page === "launcher") {

        renderIdle();
        return;

    }

    const top = currentScreen();

    if (top && typeof top.onBack === "function") {

        const handled = top.onBack();

        if (handled) {
            return;
        }

    }

    leaveTopScreen();

    nav.pop();

    if (nav.length) {

        appSelected = 0;
        nav[nav.length - 1].render();

    } else {

        openLauncher();

    }
}


/* =========================================================
   OPEN APP  (from launcher)
   ========================================================= */

function openApp(name) {

    page = name;
    nav = [];
    appSelected = 0;

    switch (name) {

        case "Computer":      openComputer();       break;
        case "Apps":          openAppsCategory();   break;
        case "Network":       openNetworkCategory();break;
        case "Testing":       openTesting();        break;
        case "Settings":      openSettings();       break;
        case "Boot Profiles": openBootProfiles();   break;

    }
}


/* =========================================================
   TOP-LEVEL CATEGORIES

   Each of these is a submenu that routes into the actual
   tool screens defined further down (Radio, Wi-Fi, Terminal,
   Files, etc) — same behavior as before, just organized the
   way the real Flipper One groups them.
   ========================================================= */

function openComputer() {

    pushScreen({

        render: () => appFrame("🖥️", "Computer", [
            "▶ Terminal",
            "   Files",
            "   System Info",
            "   Storage",
            "   Modules",
            "   Launch Desktop Mode",
            "   Connect External Display",
            "   TV Mode",
            "   Remote Desktop (VNC)"
        ]),

        onSelect: (index) => {

            switch (index) {

                case 0: openTerminal(); break;
                case 1: openFiles(); break;

                case 2:
                    pushScreen(detailScreen("🖥️", "System Info", [
                        "CPU: RK3576 quad-core",
                        "RAM: 4 GB, 2.1 GB free",
                        "OS: Flipper OS (Debian)",
                        "Uptime: 2h 14m"
                    ]));
                    break;

                case 3:
                    pushScreen(detailScreen("🖥️", "Storage", [
                        "Root: 12 GB / 64 GB used",
                        "SD card: not inserted"
                    ]));
                    break;

                case 4: openModules(); break;

                case 5:
                    runThenShow("🖥️", "Desktop Mode", "Starting WebKit desktop...", [
                        "Desktop session active",
                        "Resolution: 1920x1080"
                    ]);
                    break;

                case 6:
                    pushScreen(detailScreen("🖥️", "External Display", [
                        "No display detected",
                        "Connect via USB-C or HDMI"
                    ]));
                    break;

                case 7:
                    runThenShow("🖥️", "TV Mode", "Switching output...", [
                        "TV Mode active",
                        "Output: HDMI 1080p60"
                    ]);
                    break;

                case 8:
                    pushScreen(detailScreen("🖥️", "Remote Desktop", [
                        "VNC server: stopped",
                        "Enable in Settings"
                    ]));
                    break;

            }

        }

    });

}

function openAppsCategory() {

    pushScreen({

        render: () => appFrame("🧩", "Apps", [
            "▶ AI",
            "   Calculator",
            "   Stopwatch",
            "   Timer",
            "   Random Number",
            "   App Manager"
        ]),

        onSelect: (index) => {

            switch (index) {

                case 0: openAI(); break;
                case 1: openCalculator(); break;
                case 2: openStopwatch(); break;
                case 3: openCountdown(); break;
                case 4: openRandom(); break;
                case 5: openApps(); break;

            }

        }

    });

}

function openNetworkCategory() {

    pushScreen({

        render: () => appFrame("🌐", "Network", [
            "▶ Wi-Fi",
            "   Cellular",
            "   Radio / SDR",
            "   Satellite",
            "   Network Tools"
        ]),

        onSelect: (index) => {

            switch (index) {

                case 0: openWifi(); break;
                case 1: openCellular(); break;
                case 2: openRadio(); break;
                case 3: openSatellite(); break;
                case 4: openNetwork(); break;

            }

        }

    });

}

function openTesting() {

    pushScreen({

        render: () => appFrame("🧪", "Testing", [
            "▶ Device Test",
            "   Network Test",
            "   Module Test",
            "   Test Reports"
        ]),

        onSelect: (index) => {

            switch (index) {

                case 0: openDeviceTest(); break;

                case 1:
                    runThenShow("🧪", "Network Test", "Running checks...", [
                        "Wi-Fi:     PASS",
                        "Ethernet:  PASS",
                        "LTE:       PASS"
                    ]);
                    break;

                case 2: openModules(); break;

                case 3:
                    pushScreen(detailScreen("🧪", "Test Reports", [
                        "Last run: today",
                        "3 / 3 suites passed"
                    ]));
                    break;

            }

        }

    });

}

const bootProfiles = [

    { name: "Network Router",   icon: "📡", lastUsed: "2 days ago",  user: false, active: true },
    { name: "Radio Lab",        icon: "📻", lastUsed: "5 days ago",  user: false, active: false },
    { name: "Desktop Computer", icon: "🖥️", lastUsed: "Today",       user: false, active: false },
    { name: "TV Media Box",     icon: "📺", lastUsed: "3 weeks ago", user: false, active: false },
    { name: "[MyTravelRouter]", icon: "📡", lastUsed: "1 week ago",  user: true,  active: false }

];

function openBootProfiles() {

    pushScreen({

        render: () => appFrame("💾", "Boot Profiles", bootProfiles.map((p, i) =>
            `${i === 0 ? "▶" : " "} ${p.icon} ${p.name}${p.active ? "  (active)" : ""}`
        ), "▶ Manage   ◀ Back"),

        onSelect: (index) => openProfileDetail(bootProfiles[index])

    });

}

function openProfileDetail(profile) {

    const actions = ["▶ Boot", "   Clone", "   Reset to Default"];

    if (profile.user) {
        actions.push("   Delete");
    }

    pushScreen({

        render: () => appFrame(profile.icon, profile.name, [
            ...actions,
            "",
            `Last used: ${profile.lastUsed}`
        ], "▶ Select   ◀ Back"),

        onSelect: (index) => {

            if (index === 0) {

                runThenShow(profile.icon, profile.name, "Loading kernel & overlay...", [
                    "Mounting root filesystem",
                    `Profile "${profile.name}" ready`,
                    "Reboot to switch ✔"
                ]);

            } else if (index === 1) {

                const cloneName = `[${profile.name.replace(/[\[\]]/g, "")}-copy]`;

                bootProfiles.push({
                    name: cloneName,
                    icon: profile.icon,
                    lastUsed: "just now",
                    user: true,
                    active: false
                });

                pushScreen(detailScreen(profile.icon, "Clone", [
                    "Cloned as a user profile:",
                    cloneName,
                    "",
                    "Find it in Boot Profiles"
                ]));

            } else if (index === 2) {

                runThenShow(profile.icon, profile.name, "Reverting overlay to default...", [
                    "User changes discarded",
                    "Profile reset ✔"
                ]);

            } else if (index === 3 && profile.user) {

                const idx = bootProfiles.indexOf(profile);

                if (idx !== -1) {
                    bootProfiles.splice(idx, 1);
                }

                back();

            }

        }

    });

}


/* =========================================================
   GENERIC APP FRAME (menu-style screen)
   ========================================================= */

function appFrame(icon, name, rows, info = "▲ ▼ Navigate   ▶ Select") {

    screen.innerHTML = `

        <div class="status">
            <span>${icon} ${name}</span>
            <span>BAT ${batteryPct}%</span>
        </div>

        <div class="title">
            ${name}
        </div>

        <div class="app-content" id="appContent">

            ${
                rows.map((row, index) => `
                <div
                    data-row="${index}"
                    class="app-line ${index === 0 ? "selected" : ""}"
                >
                    ${row}
                </div>
                `).join("")
            }

        </div>

        <div class="info">
            <div class="soft-buttons">
                ${softButtons(info)}
            </div>
        </div>

    `;

}

/* turns "▲ ▼ Navigate   ▶ Select" into separate button pills,
   splitting on the existing double-space convention */
function softButtons(info) {

    return info
        .split(/\s{2,}/)
        .map(seg => `<span class="soft-btn">${seg.trim()}</span>`)
        .join("");

}

function setRow(index, text) {

    const row = document.querySelector(`.app-line[data-row="${index}"]`);

    if (row) {
        row.textContent = text;
    }

}

let terminalHistory = [
    "FLIPPER ONE TERMINAL",
    "Type 'help' for commands."
];

function openTerminal() {

        render: renderTerminal,

function renderTerminal() {

    screen.innerHTML = `

        <div class="status">
            <span>💻 TERMINAL</span>
            <span>${batteryPct}%</span>
        </div>

        <div class="title">Console</div>

        <div class="terminal" id="terminalOutput">
            ${terminalHistory.join("<br>")}
            <br><span>$</span>
            <input id="terminalInput" class="terminal-input" autocomplete="off" autofocus>
        </div>

        <div class="info"><div class="soft-buttons">${softButtons("Type commands   ◀ Back")}</div></div>

    `;

    const input = document.getElementById("terminalInput");
    input.focus();

    input.addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
            runCommand(input.value);
        }

    });

}

function runCommand(command) {

    const cmd = command.trim().toLowerCase();

    if (!cmd) {
        return;
    }

    terminalHistory.push("$ " + command);

    switch (cmd) {

        case "help":
            terminalHistory.push("help  status  scan  ls  battery  clear  reboot  about");
            break;

        case "status":
            terminalHistory.push(`FLIPPER ONE ONLINE | BAT ${batteryPct}%`);
            break;

        case "scan":
            terminalHistory.push("Scanning...", "Found 6 devices.");
            break;

        case "ls":
            terminalHistory.push("apps/  data/  logs/  config/  system/");
            break;

        case "battery":
            terminalHistory.push(`Battery: ${batteryPct}%`);
            break;

        case "about":
            terminalHistory.push("Flipper One Simulator", "Virtual hardware environment.");
            break;

        case "reboot":
            terminalHistory.push("Rebooting...", "System ready.");
            break;

        case "clear":
            terminalHistory = [];
            break;

        default:
            terminalHistory.push("Command not found: " + cmd);

    }

    renderTerminal();

}

function openStopwatch() {

    let seconds = 0;
    let running = false;
    let timer = null;

    const fmt = (s) => {
        const m = String(Math.floor(s / 60)).padStart(2, "0");
        const r = String(s % 60).padStart(2, "0");
        return `${m}:${r}`;
    };

    const render = () => {

        appFrame("🔧", "Stopwatch", [
            `Time: ${fmt(seconds)}`,
            running ? "▶ Stop" : "▶ Start",
            "   Reset"
        ], "◀ Back");

    };

    pushScreen({

        render,

        onSelect: (index) => {

            if (index === 0) return;

            if (index === 1) {

                running = !running;

                if (running) {

                    timer = setInterval(() => {
                        seconds++;
                        render();
                    }, 1000);

                } else {

                    clearInterval(timer);

                }

                render();

            } else if (index === 2) {

                seconds = 0;
                render();

            }

        },

        cleanup: () => clearInterval(timer)

    });

}

function openCountdown() {

    let remaining = 60;
    let timer = null;
    let running = false;

    const render = () => {

        appFrame("🔧", "Timer", [
            `Remaining: ${remaining}s`,
            running ? "▶ Pause" : "▶ Start",
            "   Reset to 60s"
        ], "◀ Back");

    };

    pushScreen({

        render,

        onSelect: (index) => {

            if (index === 1) {

                running = !running;

                if (running) {

                    timer = setInterval(() => {

                        remaining = Math.max(0, remaining - 1);
                        render();

                        if (remaining === 0) {
                            clearInterval(timer);
                            running = false;
                            render();
                        }

                    }, 1000);

                } else {

                    clearInterval(timer);

                }

                render();

            } else if (index === 2) {

                clearInterval(timer);
                running = false;
                remaining = 60;
                render();

            }

        },

        cleanup: () => clearInterval(timer)

    });

}

            `${i === 0 ? "▶" : " "} ${c.type === "dir" ? "📁" : "📄"} ${c.name}`

        onSelect: (index) => {

                filesPath.pop();
                nav.pop();
                appSelected = 0;
                nav[nav.length - 1].render();
                return true;

document.addEventListener("keydown", function (event) {

    const inField =
        document.activeElement &&
        (document.activeElement.id === "terminalInput" ||
         document.activeElement.id === "aiInput" ||
         document.activeElement.id === "calcInput");

    switch (event.key) {

        case "ArrowUp":
            if (inField) return;
            event.preventDefault();
            move(-1);
            break;

        case "ArrowDown":
            if (inField) return;
            event.preventDefault();
            move(1);
            break;

        case "ArrowRight":
        case "Enter":
            if (inField) return;
            event.preventDefault();
            select();
            break;

        case "ArrowLeft":
        case "Escape":
        case "Backspace":
            if (inField) return;
            event.preventDefault();
            back();
            break;

        case "Home":
            event.preventDefault();
            home();
            break;

    }

});


/* =========================================================
   START
   ========================================================= */

renderIdle();

</script>
