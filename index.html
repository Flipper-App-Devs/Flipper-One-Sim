<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipper One Simulator</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: monospace;
}

#app {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   DEVICE
   ========================================================= */

.device {
    position: relative;

    width: min(100vw, 1024px);

    aspect-ratio: 1024 / 448;
}


/* =========================================================
   FIXED OVERLAY IMAGE

   THIS NEVER MOVES
   ========================================================= */

.device-image {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   LCD SCREEN

   ONLY THE LCD MOVES
   ========================================================= */

.screen {
    position: absolute;

    left: calc(50.25% + 3mm);
    top: 45.1%;

    width: calc(33.5% - 2mm);
    height: 42.8%;

    transform: translate(-50%, -50%);

    z-index: 10;

    background: #f28c28;

    color: #321400;

    padding: 8px;

    border: none;

    border-radius: 2px;

    overflow: hidden;

    font-family: monospace;

    box-shadow:
        inset 0 0 0 2px rgba(55, 20, 0, 0.25),
        inset 0 0 14px rgba(90, 30, 0, 0.18);
}


/* =========================================================
   TOP BAR
   ========================================================= */

.status {
    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #d96f18;

    color: #241000;

    margin: -8px -8px 0 -8px;

    padding: 5px 8px;

    height: 24px;

    border-bottom: 2px solid #a84d0d;

    font-size: 10px;

    font-weight: bold;

    flex-shrink: 0;
}


/* =========================================================
   TITLE
   ========================================================= */

.title {
    text-align: center;

    font-size: 14px;

    font-weight: bold;

    margin: 5px 0;

    height: 18px;

    line-height: 18px;

    flex-shrink: 0;
}


/* =========================================================
   MENU WINDOW
   ========================================================= */

.menu-window {
    position: relative;

    width: 100%;

    height: 122px;

    overflow-y: auto;

    overflow-x: hidden;

    scrollbar-width: none;

    -ms-overflow-style: none;
}

.menu-window::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   MENU
   ========================================================= */

.menu {
    list-style: none;

    padding: 0;
    margin: 0;

    width: 100%;
}

.menu li {
    height: 22px;

    min-height: 22px;

    line-height: 22px;

    padding: 0 6px;

    margin: 1px 0;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    border-radius: 2px;
}

.menu li.selected {
    background: #321400;

    color: #f28c28;
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

.scrollbar {
    position: absolute;

    top: 0;
    right: 1px;

    width: 3px;
    height: 100%;

    background: rgba(60, 20, 0, 0.15);

    border-radius: 3px;

    pointer-events: none;

    z-index: 5;
}

.scroll-thumb {
    position: absolute;

    top: 0;
    right: 0;

    width: 3px;

    min-height: 18px;

    background: #321400;

    border-radius: 3px;

    transition:
        top 0.1s ease,
        height 0.1s ease;
}


/* =========================================================
   INFO
   ========================================================= */

.info {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 5px;

    padding-top: 3px;

    border-top:
        1px solid rgba(80, 30, 0, 0.35);

    background: #f28c28;

    font-size: 8px;

    line-height: 10px;
}


/* =========================================================
   GENERIC APP CONTENT
   ========================================================= */

.app-content {
    height: 122px;

    overflow-y: auto;

    overflow-x: hidden;

    scrollbar-width: none;
}

.app-content::-webkit-scrollbar {
    display: none;
}

.app-line {
    height: 21px;

    line-height: 21px;

    padding: 0 6px;

    font-size: 10px;

    white-space: nowrap;
}

.app-line.selected {
    background: #321400;

    color: #f28c28;
}


/* =========================================================
   TERMINAL
   ========================================================= */

.terminal {
    height: 122px;

    overflow-y: auto;

    font-size: 9px;

    line-height: 13px;

    white-space: pre-wrap;

    padding: 2px 4px;

    scrollbar-width: none;
}

.terminal::-webkit-scrollbar {
    display: none;
}

.terminal-input {
    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: #321400;

    font-family: monospace;

    font-size: 9px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.control {
    position: absolute;

    z-index: 50;

    border: none;

    background: transparent;

    padding: 0;
    margin: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   D-PAD
   ========================================================= */

.up {
    left: 72.5%;
    top: 29%;

    width: 10%;
    height: 11%;
}

.down {
    left: 72.5%;
    top: 47%;

    width: 10%;
    height: 11%;
}

.left {
    left: 70%;
    top: 37%;

    width: 9%;
    height: 13%;
}

.right {
    left: 79%;
    top: 37%;

    width: 9%;
    height: 13%;
}

.ok {
    left: 76%;
    top: 35%;

    width: 7%;
    height: 13%;

    border-radius: 50%;
}


/* =========================================================
   BACK
   ========================================================= */

.back {
    left: 84%;
    top: 59%;

    width: 8%;
    height: 12%;

    border-radius: 50%;
}


/* =========================================================
   BOTTOM BUTTONS
   ========================================================= */

.bottom-left {
    left: 34%;
    top: 73%;

    width: 7%;
    height: 8%;
}

.bottom-right {
    left: 61%;
    top: 73%;

    width: 7%;
    height: 8%;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .screen {
        padding: 5px;
    }

    .status {
        height: 16px;

        margin: -5px -5px 0 -5px;

        padding: 3px 5px;

        font-size: 6px;
    }

    .title {
        font-size: 9px;

        height: 14px;

        line-height: 14px;

        margin: 3px 0;
    }

    .menu-window,
    .app-content {
        height: 88px;
    }

    .menu li {
        height: 17px;

        min-height: 17px;

        line-height: 17px;

        font-size: 7px;
    }

    .info {
        font-size: 5px;

        line-height: 7px;
    }
}

</style>
</head>


<body>

<div id="app">

<div class="device">

    <!-- FIXED DEVICE IMAGE -->
    <img
        class="device-image"
        src="./flipperone-shell-overlay.png"
        alt="Flipper One"
    >


    <!-- LCD -->
    <div
        id="screen"
        class="screen">
    </div>


    <!-- INVISIBLE BUTTON HIT AREAS -->

    <button
        class="control up"
        onclick="move(-1)">
    </button>

    <button
        class="control down"
        onclick="move(1)">
    </button>

    <button
        class="control left"
        onclick="back()">
    </button>

    <button
        class="control right"
        onclick="select()">
    </button>

    <button
        class="control ok"
        onclick="select()">
    </button>

    <button
        class="control back"
        onclick="back()">
    </button>

    <button
        class="control bottom-left"
        onclick="back()">
    </button>

    <button
        class="control bottom-right"
        onclick="home()">
    </button>

</div>

</div>


<script>

/* =========================================================
   APPS
   ========================================================= */

const apps = [

    {
        icon: "📡",
        name: "Radio / SDR"
    },

    {
        icon: "🌐",
        name: "Network"
    },

    {
        icon: "📶",
        name: "Wi-Fi"
    },

    {
        icon: "📱",
        name: "Cellular"
    },

    {
        icon: "🛰️",
        name: "Satellite"
    },

    {
        icon: "🤖",
        name: "AI"
    },

    {
        icon: "💻",
        name: "Terminal"
    },

    {
        icon: "🔧",
        name: "Tools"
    },

    {
        icon: "📂",
        name: "Files"
    },

    {
        icon: "⚙️",
        name: "Settings"
    },

    {
        icon: "🧩",
        name: "Apps"
    },

    {
        icon: "🔌",
        name: "Modules"
    }

];


/* =========================================================
   STATE
   ========================================================= */

let selected = 0;

let page = "home";

let appSelected = 0;

let terminalHistory = [
    "FLIPPER ONE TERMINAL",
    "Type 'help' for commands."
];


/* =========================================================
   DOM
   ========================================================= */

const screen =
    document.getElementById("screen");


/* =========================================================
   HOME
   ========================================================= */

function renderHome() {

    page = "home";

    screen.innerHTML = `

        <div class="status">

            <span>
                FLIPPER ONE
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">
            Applications
        </div>


        <div
            class="menu-window"
            id="menuWindow"
        >

            <ul
                class="menu"
                id="menu"
            >

                ${
                    apps.map((app, index) => `

                    <li
                        data-index="${index}"
                        class="${
                            index === selected
                                ? "selected"
                                : ""
                        }"
                    >

                        ${app.icon}
                        ${app.name}

                    </li>

                    `).join("")
                }

            </ul>


            <div class="scrollbar">

                <div
                    class="scroll-thumb"
                    id="scrollThumb">
                </div>

            </div>

        </div>


        <div class="info">

            ▲ ▼ Navigate
            &nbsp; ▶ Open

        </div>
    `;


    requestAnimationFrame(() => {

        const menuWindow =
            document.getElementById("menuWindow");

        if (menuWindow) {

            menuWindow.addEventListener(
                "scroll",
                updateScrollbar
            );

        }

        scrollToSelected();

        updateScrollbar();

    });
}


/* =========================================================
   SCROLL TO SELECTED
   ========================================================= */

function scrollToSelected() {

    const menuWindow =
        document.getElementById("menuWindow");

    const item =
        document.querySelector(
            `.menu li[data-index="${selected}"]`
        );


    if (!menuWindow || !item) {
        return;
    }


    const itemTop =
        item.offsetTop;

    const itemBottom =
        itemTop +
        item.offsetHeight;

    const visibleTop =
        menuWindow.scrollTop;

    const visibleBottom =
        visibleTop +
        menuWindow.clientHeight;


    if (itemTop < visibleTop) {

        menuWindow.scrollTop =
            itemTop;

    }
    else if (
        itemBottom >
        visibleBottom
    ) {

        menuWindow.scrollTop =
            itemBottom -
            menuWindow.clientHeight;

    }


    updateScrollbar();
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

function updateScrollbar() {

    const menuWindow =
        document.getElementById("menuWindow");

    const thumb =
        document.getElementById("scrollThumb");


    if (!menuWindow || !thumb) {
        return;
    }


    const scrollHeight =
        menuWindow.scrollHeight;

    const visibleHeight =
        menuWindow.clientHeight;

    const maxScroll =
        scrollHeight -
        visibleHeight;


    if (maxScroll <= 0) {

        thumb.style.height = "0px";
        thumb.style.top = "0px";

        return;
    }


    const thumbHeight =
        Math.max(
            18,
            (
                visibleHeight /
                scrollHeight
            ) *
            visibleHeight
        );


    const maxThumbTop =
        visibleHeight -
        thumbHeight;


    const scrollPercent =
        menuWindow.scrollTop /
        maxScroll;


    thumb.style.height =
        `${thumbHeight}px`;

    thumb.style.top =
        `${scrollPercent * maxThumbTop}px`;
}


/* =========================================================
   MOVE
   ========================================================= */

function move(direction) {

    if (page === "home") {

        selected += direction;


        if (selected < 0) {

            selected =
                apps.length - 1;

        }


        if (
            selected >=
            apps.length
        ) {

            selected = 0;

        }


        renderHome();

        return;
    }


    if (
        page === "Wi-Fi" ||
        page === "Network" ||
        page === "Radio / SDR" ||
        page === "Satellite" ||
        page === "Settings" ||
        page === "Tools" ||
        page === "Files" ||
        page === "Apps" ||
        page === "Modules"
    ) {

        moveAppMenu(direction);

    }
}


/* =========================================================
   APP MENU NAVIGATION
   ========================================================= */

function moveAppMenu(direction) {

    const items =
        document.querySelectorAll(
            ".app-line"
        );


    if (!items.length) {
        return;
    }


    appSelected += direction;


    if (appSelected < 0) {

        appSelected =
            items.length - 1;

    }


    if (
        appSelected >=
        items.length
    ) {

        appSelected = 0;

    }


    items.forEach(
        (item, index) => {

            item.classList.toggle(
                "selected",
                index === appSelected
            );

        }
    );


    items[
        appSelected
    ].scrollIntoView({
        block: "nearest"
    });
}


/* =========================================================
   SELECT
   ========================================================= */

function select() {

    if (page === "home") {

        openApp(
            apps[selected].name
        );

        return;
    }


    handleAppSelect();
}


/* =========================================================
   OPEN APP
   ========================================================= */

function openApp(name) {

    page = name;

    appSelected = 0;


    switch (name) {

        case "Radio / SDR":

            renderRadio();

            break;


        case "Network":

            renderNetwork();

            break;


        case "Wi-Fi":

            renderWifi();

            break;


        case "Cellular":

            renderCellular();

            break;


        case "Satellite":

            renderSatellite();

            break;


        case "AI":

            renderAI();

            break;


        case "Terminal":

            renderTerminal();

            break;


        case "Tools":

            renderTools();

            break;


        case "Files":

            renderFiles();

            break;


        case "Settings":

            renderSettings();

            break;


        case "Apps":

            renderApps();

            break;


        case "Modules":

            renderModules();

            break;

    }
}


/* =========================================================
   GENERIC APP
   ========================================================= */

function appFrame(
    icon,
    name,
    rows,
    info = "▲ ▼ Navigate   ▶ Select"
) {

    screen.innerHTML = `

        <div class="status">

            <span>
                ${icon} ${name}
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">
            ${name}
        </div>


        <div
            class="app-content"
            id="appContent"
        >

            ${
                rows.map(
                    (row, index) => `

                    <div
                        class="app-line ${
                            index === 0
                                ? "selected"
                                : ""
                        }"
                    >
                        ${row}
                    </div>

                `
                ).join("")
            }

        </div>


        <div class="info">
            ${info}
        </div>

    `;
}


/* =========================================================
   RADIO / SDR
   ========================================================= */

function renderRadio() {

    appFrame(
        "📡",
        "Radio / SDR",
        [
            "▶ 433.920 MHz",
            "   868.000 MHz",
            "   915.000 MHz",
            "   2.400 GHz",
            "   Scan Spectrum",
            "   Signal Monitor"
        ]
    );
}


function radioAction() {

    const items =
        document.querySelectorAll(
            ".app-line"
        );


    if (appSelected === 4) {

        items[4].textContent =
            "▶ SCANNING...";

        setTimeout(() => {

            items[4].textContent =
                "▶ Signal: -61 dBm";

        }, 1000);

    }
}


/* =========================================================
   NETWORK
   ========================================================= */

function renderNetwork() {

    appFrame(
        "🌐",
        "Network",
        [
            "▶ Network Status",
            "   Scan Devices",
            "   Local Gateway",
            "   DNS Test",
            "   Ping Test",
            "   MAC Address"
        ]
    );
}


/* =========================================================
   WIFI
   ========================================================= */

function renderWifi() {

    appFrame(
        "📶",
        "Wi-Fi",
        [
            "▶ Scan Networks",
            "   HomeNet       -42 dBm",
            "   FLIPPER-LAB   -57 dBm",
            "   Guest_WiFi    -68 dBm",
            "   CoffeeShop    -74 dBm",
            "   Network Info"
        ]
    );
}


function wifiAction() {

    if (appSelected === 0) {

        const first =
            document.querySelector(
                ".app-line"
            );

        first.textContent =
            "▶ SCANNING Wi-Fi...";


        setTimeout(() => {

            first.textContent =
                "▶ 7 NETWORKS FOUND";

        }, 1000);

    }
}


/* =========================================================
   CELLULAR
   ========================================================= */

function renderCellular() {

    appFrame(
        "📱",
        "Cellular",
        [
            "▶ Signal: 78%",
            "   Operator: FLIP",
            "   Network: LTE",
            "   Band: B12",
            "   Cell ID: 1842",
            "   Tower Info"
        ]
    );
}


/* =========================================================
   SATELLITE
   ========================================================= */

function renderSatellite() {

    appFrame(
        "🛰️",
        "Satellite",
        [
            "▶ Search Satellites",
            "   GPS: Searching...",
            "   SAT-01   42°",
            "   SAT-02   67°",
            "   SAT-03   81°",
            "   Signal Map"
        ]
    );
}


/* =========================================================
   AI
   ========================================================= */

function renderAI() {

    appFrame(
        "🤖",
        "AI",
        [
            "▶ Ask AI",
            "   System Status",
            "   Analyze Signal",
            "   Explain Device",
            "   Generate Code",
            "   About AI"
        ]
    );
}


/* =========================================================
   TERMINAL
   ========================================================= */

function renderTerminal() {

    screen.innerHTML = `

        <div class="status">

            <span>💻 TERMINAL</span>

            <span>87%</span>

        </div>


        <div class="title">
            Console
        </div>


        <div
            class="terminal"
            id="terminalOutput"
        >

            ${
                terminalHistory.join("<br>")
            }

            <br>

            <span>
                $
            </span>

            <input
                id="terminalInput"
                class="terminal-input"
                autocomplete="off"
                autofocus
            >

        </div>


        <div class="info">
            Type commands &nbsp; ◀ Back
        </div>

    `;


    const input =
        document.getElementById(
            "terminalInput"
        );


    input.focus();


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                runCommand(
                    input.value
                );

            }

        }
    );
}


/* =========================================================
   TERMINAL COMMANDS
   ========================================================= */

function runCommand(command) {

    const cmd =
        command.trim().toLowerCase();


    if (!cmd) {
        return;
    }


    terminalHistory.push(
        "$ " + command
    );


    switch (cmd) {

        case "help":

            terminalHistory.push(
                "help  status  scan  clear  reboot  about"
            );

            break;


        case "status":

            terminalHistory.push(
                "FLIPPER ONE ONLINE | BAT 87%"
            );

            break;


        case "scan":

            terminalHistory.push(
                "Scanning...",
                "Found 6 devices."
            );

            break;


        case "about":

            terminalHistory.push(
                "Flipper One Simulator",
                "Virtual hardware environment."
            );

            break;


        case "reboot":

            terminalHistory.push(
                "Rebooting...",
                "System ready."
            );

            break;


        case "clear":

            terminalHistory = [];

            break;


        default:

            terminalHistory.push(
                "Command not found: " + cmd
            );

    }


    renderTerminal();
}


/* =========================================================
   TOOLS
   ========================================================= */

function renderTools() {

function renderSettings() {

        [
            "▶ Brightness: 80%",
            "   Sound: ON",
            "   Vibration: ON",

            "   Bluetooth: OFF",

        ]

/* =========================================================

function renderApps() {

    appFrame(

        "Apps",
        [
            "▶ Installed: 12",

}


/* =========================================================

function renderModules() {

        "Modules",
        [
            "▶ GPIO Module",
            "   Radio Module",
            "   Sensor Module",
            "   Display Module",
            "   USB Module",
            "   Module Info"
        ]
    );
}


/* =========================================================
   APP SELECT ACTION
   ========================================================= */

function handleAppSelect() {

    if (page === "Radio / SDR") {

        radioAction();

        return;
    }


    if (page === "Wi-Fi") {

        wifiAction();

        return;
    }


    /*
       Generic fake action
    */

    const items =
        document.querySelectorAll(
            ".app-line"
        );


    if (
        items[appSelected]
    ) {

        const original =
            items[appSelected]
                .textContent;


        items[appSelected]
            .textContent =
            "▶ Running...";


        setTimeout(() => {

            items[appSelected]
                .textContent =
                original
                .replace("▶ ", "");

        }, 900);

    }
}


/* =========================================================
   BACK
   ========================================================= */

function back() {

    if (page !== "home") {

        renderHome();

    }

}


/* =========================================================
   HOME
   ========================================================= */

function home() {

    selected = 0;

    renderHome();

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        switch (event.key) {

            case "ArrowUp":

                /*
                   Don't steal terminal input arrows
                */

                if (
                    document.activeElement &&
                    document.activeElement.id ===
                    "terminalInput"
                ) {
                    return;
                }

                event.preventDefault();

                move(-1);

                break;


            case "ArrowDown":

                if (
                    document.activeElement &&
                    document.activeElement.id ===
                    "terminalInput"
                ) {
                    return;
                }

                event.preventDefault();

                move(1);

                break;


            case "ArrowRight":

            case "Enter":

                if (
                    document.activeElement &&
                    document.activeElement.id ===
                    "terminalInput"
                ) {
                    return;
                }

                event.preventDefault();

                select();

                break;


            case "ArrowLeft":

            case "Escape":

            case "Backspace":

                if (
                    document.activeElement &&
                    document.activeElement.id ===
                    "terminalInput"
                ) {
                    return;
                }

                event.preventDefault();

                back();

                break;


            case "Home":

                event.preventDefault();

                home();

                break;

        }

    }
);


/* =========================================================
   START
   ========================================================= */

renderHome();

</script>
