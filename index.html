<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipper One Simulator</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: monospace;
}

#app {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   DEVICE
   ========================================================= */

.device {
    position: relative;

    width: min(100vw, 1024px);

    aspect-ratio: 1024 / 448;
}


/* =========================================================
   FIXED FLIPPER IMAGE
   ========================================================= */

.device-image {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   LCD SCREEN

   ONLY THIS ELEMENT MOVES.
   THE IMAGE ABOVE NEVER MOVES.
   ========================================================= */

.screen {
    position: absolute;

    left: calc(33.5% + 3mm);
    top: 23.7%;

    width: calc(34.2% - 2mm);
    height: calc(43.5% - 2mm);

    z-index: 10;

    background: #f28c28;

    color: #321400;

    padding: 8px;

    border: none;
    border-radius: 2px;

    overflow: hidden;

    font-family: monospace;

    box-shadow:
        inset 0 0 0 2px rgba(55, 20, 0, 0.25),
        inset 0 0 14px rgba(90, 30, 0, 0.18);
}

/* =========================================================
   TOP BAR
   ========================================================= */

.status {
    display: flex;

    align-items: center;
    justify-content: space-between;

    /*
       Slightly darker than the LCD
    */

    background: #d96f18;

    color: #241000;

    margin: -8px -8px 0 -8px;

    padding: 5px 8px;

    height: 24px;

    border-bottom: 2px solid #a84d0d;

    font-size: 10px;

    font-weight: bold;

    flex-shrink: 0;
}


/* =========================================================
   TITLE
   ========================================================= */

.title {
    text-align: center;

    font-size: 14px;

    font-weight: bold;

    margin: 6px 0;

    height: 18px;

    line-height: 18px;

    flex-shrink: 0;
}


/* =========================================================
   REAL SCROLLING MENU
   ========================================================= */

.menu-window {
    position: relative;

    width: 100%;

    height: 122px;

    overflow-y: auto;
    overflow-x: hidden;

    /*
       Hide native scrollbar
    */

    scrollbar-width: none;
    -ms-overflow-style: none;
}

.menu-window::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   MENU
   ========================================================= */

.menu {
    list-style: none;

    padding: 0;
    margin: 0;

    width: 100%;
}


/* =========================================================
   APP ROW
   ========================================================= */

.menu li {
    height: 22px;

    min-height: 22px;

    line-height: 22px;

    padding: 0 6px;

    margin: 1px 0;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    border-radius: 2px;
}


/* =========================================================
   SELECTED APP
   ========================================================= */

.menu li.selected {
    background: #321400;

    color: #f28c28;
}


/* =========================================================
   SCROLL INDICATOR
   ========================================================= */

.scrollbar {
    position: absolute;

    right: 1px;
    top: 0;

    width: 3px;
    height: 100%;

    background: rgba(60, 20, 0, 0.12);

    border-radius: 3px;

    pointer-events: none;
}

.scroll-thumb {
    position: absolute;

    left: 0;

    width: 3px;

    min-height: 20px;

    background: #321400;

    border-radius: 3px;

    transition:
        top 0.12s ease;
}


/* =========================================================
   INFO
   ========================================================= */

.info {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 5px;

    padding-top: 3px;

    border-top:
        1px solid rgba(80, 30, 0, 0.35);

    background: #f28c28;

    font-size: 8px;

    line-height: 10px;
}


/* =========================================================
   INVISIBLE BUTTON HIT AREAS
   ========================================================= */

.control {
    position: absolute;

    z-index: 50;

    border: none;

    background: transparent;

    padding: 0;
    margin: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   UP
   ========================================================= */

.up {
    left: 72.5%;
    top: 29%;

    width: 10%;
    height: 11%;
}


/* =========================================================
   DOWN
   ========================================================= */

.down {
    left: 72.5%;
    top: 47%;

    width: 10%;
    height: 11%;
}


/* =========================================================
   LEFT
   ========================================================= */

.left {
    left: 70%;
    top: 37%;

    width: 9%;
    height: 13%;
}


/* =========================================================
   RIGHT
   ========================================================= */

.right {
    left: 79%;
    top: 37%;

    width: 9%;
    height: 13%;
}


/* =========================================================
   OK
   ========================================================= */

.ok {
    left: 76%;
    top: 35%;

    width: 7%;
    height: 13%;

    border-radius: 50%;
}


/* =========================================================
   BACK
   ========================================================= */

.back {
    left: 84%;
    top: 59%;

    width: 8%;
    height: 12%;

    border-radius: 50%;
}


/* =========================================================
   BOTTOM LEFT
   ========================================================= */

.bottom-left {
    left: 34%;
    top: 73%;

    width: 7%;
    height: 8%;
}


/* =========================================================
   BOTTOM RIGHT
   ========================================================= */

.bottom-right {
    left: 61%;
    top: 73%;

    width: 7%;
    height: 8%;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .screen {
        padding: 5px;
    }

    .status {
        height: 16px;

        margin: -5px -5px 0 -5px;

        padding: 3px 5px;

        font-size: 6px;
    }

    .title {
        font-size: 9px;

        height: 14px;

        line-height: 14px;

        margin: 3px 0;
    }

    .menu-window {
        height: 88px;
    }

    .menu li {
        height: 17px;

        min-height: 17px;

        line-height: 17px;

        font-size: 7px;
    }

    .info {
        font-size: 5px;

        line-height: 7px;
    }
}

</style>
</head>


<body>

<div id="app">

    <div class="device">

        <!-- =================================================
             FIXED OVERLAY IMAGE
             ================================================= -->

        <img
            class="device-image"
            src="./flipperone-shell-overlay.png"
            alt="Flipper One"
        >


        <!-- =================================================
             ORANGE LCD
             ================================================= -->

        <div
            id="screen"
            class="screen">
        </div>


        <!-- =================================================
             BUTTON HIT AREAS
             ================================================= -->

        <button
            class="control up"
            onclick="move(-1)"
            aria-label="Up">
        </button>

        <button
            class="control down"
            onclick="move(1)"
            aria-label="Down">
        </button>

        <button
            class="control left"
            onclick="back()"
            aria-label="Back">
        </button>

        <button
            class="control right"
            onclick="select()"
            aria-label="Select">
        </button>

        <button
            class="control ok"
            onclick="select()"
            aria-label="OK">
        </button>

        <button
            class="control back"
            onclick="back()"
            aria-label="Back">
        </button>

        <button
            class="control bottom-left"
            onclick="back()"
            aria-label="Back">
        </button>

        <button
            class="control bottom-right"
            onclick="home()"
            aria-label="Home">
        </button>

    </div>

</div>


<script>

/* =========================================================
   FLIPPER ONE APPS
   ========================================================= */

const apps = [

    {
        icon: "📡",
        name: "Radio / SDR"
    },

    {
        icon: "🌐",
        name: "Network"
    },

    {
        icon: "📶",
        name: "Wi-Fi"
    },

    {
        icon: "📱",
        name: "Cellular"
    },

    {
        icon: "🛰️",
        name: "Satellite"
    },

    {
        icon: "🤖",
        name: "AI"
    },

    {
        icon: "💻",
        name: "Terminal"
    },

    {
        icon: "🔧",
        name: "Tools"
    },

    {
        icon: "📂",
        name: "Files"
    },

    {
        icon: "⚙️",
        name: "Settings"
    },

    {
        icon: "🧩",
        name: "Apps"
    },

    {
        icon: "🔌",
        name: "Modules"
    }

];


/* =========================================================
   STATE
   ========================================================= */

let selected = 0;

let page = "home";

const screen =
    document.getElementById("screen");


/* =========================================================
   RENDER HOME
   ========================================================= */

function renderHome() {

    page = "home";

    screen.innerHTML = `

        <div class="status">

            <span>
                FLIPPER ONE
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">
            Applications
        </div>


        <div
            class="menu-window"
            id="menuWindow"
        >

            <ul
                class="menu"
                id="menu"
            >

                ${
                    apps.map((app, index) => `

                        <li
                            data-index="${index}"
                            class="${
                                index === selected
                                    ? "selected"
                                    : ""
                            }"
                        >

                            ${app.icon}
                            ${app.name}

                        </li>

                    `).join("")
                }

            </ul>


            <div
                class="scrollbar"
                id="scrollbar"
            >

                <div
                    class="scroll-thumb"
                    id="scrollThumb"
                ></div>

            </div>

        </div>


        <div class="info">

            ▲ ▼ Navigate
            &nbsp;&nbsp;
            ▶ Select

        </div>

    `;


    /*
       Wait until DOM is rendered.
    */

    requestAnimationFrame(() => {

        scrollToSelected();

        updateScrollbar();

    });
}


/* =========================================================
   SCROLL TO SELECTED
   ========================================================= */

function scrollToSelected() {

    const windowElement =
        document.getElementById("menuWindow");

    const item =
        document.querySelector(
            `.menu li[data-index="${selected}"]`
        );


    if (!windowElement || !item) {
        return;
    }


    /*
       Real native scrolling.
    */

    const itemTop =
        item.offsetTop;

    const itemBottom =
        itemTop + item.offsetHeight;

    const viewTop =
        windowElement.scrollTop;

    const viewBottom =
        viewTop +
        windowElement.clientHeight;


    if (itemTop < viewTop) {

        windowElement.scrollTop =
            itemTop;

    }
    else if (itemBottom > viewBottom) {

        windowElement.scrollTop =
            itemBottom -
            windowElement.clientHeight;

    }


    updateScrollbar();
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

function updateScrollbar() {

    const windowElement =
        document.getElementById("menuWindow");

    const thumb =
        document.getElementById("scrollThumb");


    if (!windowElement || !thumb) {
        return;
    }


    const maxScroll =
        windowElement.scrollHeight -
        windowElement.clientHeight;


    if (maxScroll <= 0) {

        thumb.style.height = "100%";
        thumb.style.top = "0";

        return;
    }


    const visibleRatio =
        windowElement.clientHeight /
        windowElement.scrollHeight;


    const thumbHeight =
        Math.max(
            20,
            windowElement.clientHeight *
            visibleRatio
        );


    const travel =
        windowElement.clientHeight -
        thumbHeight;


    const percentage =
        windowElement.scrollTop /
        maxScroll;


    thumb.style.height =
        `${thumbHeight}px`;

    thumb.style.top =
        `${travel * percentage}px`;
}


/* =========================================================
   NATIVE SCROLL EVENT
   ========================================================= */

document.addEventListener(
    "scroll",
    function(event) {

        if (
            event.target &&
            event.target.id === "menuWindow"
        ) {

            updateScrollbar();

        }

    },
    true
);


/* =========================================================
   MOVE
   ========================================================= */

function move(direction) {

    if (page !== "home") {
        return;
    }


    selected += direction;


    if (selected < 0) {

        selected =
            apps.length - 1;

    }


    if (selected >= apps.length) {

        selected = 0;

    }


    renderHome();
}


/* =========================================================
   SELECT
   ========================================================= */

function select() {

    if (page !== "home") {
        return;
    }


    const app =
        apps[selected];


    page =
        app.name;


    screen.innerHTML = `

        <div class="status">

            <span>
                ${app.icon}
                ${app.name}
            </span>

            <span>
                BAT 87%
            </span>

        </div>


        <div class="title">

            ${app.icon}
            ${app.name}

        </div>


        <div
            class="menu-window"
        >

            <ul class="menu">

                <li class="selected">
                    ▶ Start
                </li>

                <li>
                    Options
                </li>

                <li>
                    Saved Data
                </li>

                <li>
                    About
                </li>

            </ul>

        </div>


        <div class="info">

            FLIPPER ONE<br>
            Virtual environment.

        </div>

    `;
}


/* =========================================================
   BACK
   ========================================================= */

function back() {

    if (page !== "home") {

        renderHome();

    }
}


/* =========================================================
   HOME
   ========================================================= */

function home() {

    selected = 0;

    renderHome();

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        switch (event.key) {

            case "ArrowUp":

                event.preventDefault();

                move(-1);

                break;


            case "ArrowDown":

                event.preventDefault();

                move(1);

                break;


            case "ArrowRight":

            case "Enter":

                event.preventDefault();

                select();

                break;


            case "ArrowLeft":

            case "Escape":

            case "Backspace":

                event.preventDefault();

                back();

                break;


            case "Home":

                event.preventDefault();

                home();

                break;

        }

    }
);


/* =========================================================
   START
   ========================================================= */

renderHome();

</script>

</body>
</html>
